[project]
name = "data-engineering-etl"
version = "0.1.0"
description = "Hands-on data engineering ETL with Python course with matching scripts, notebooks, and exercises."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb-sqlalchemy>=1.5.3",
    "faker>=19.0.0",
    "ipykernel>=7.3.0",
    "ipython>=8.39.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pytest>=7.4.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "schedule>=1.2.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
  "flake8>=7.3.0",
  "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["**/notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [".venv", "**/notebooks/*.ipynb"]
